<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" width="100%" height="100%">
  <style>
    :root {
      --bg: #0C0D0E;
      --border: rgba(255, 255, 255, 0.08);
      --title: #FFFFFF;
      --sub: #909096;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #FAF8F5;
        --border: #E8E3DE;
        --title: #1A1A1A;
        --sub: #5F5E5E;
      }
      .bg-canvas { fill: #FAF8F5 !important; stroke: #E8E3DE !important; }
      .header-title { fill: #1A1A1A !important; }
      .header-sub { fill: #5F5E5E !important; }
    }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .bg-canvas { fill: #0C0D0E; }
    .header-title { fill: #FFFFFF; }
    .header-sub { fill: #909096; }

    @keyframes softPulse {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 1; }
    }
    .swatch-anim {
      animation: softPulse 4s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      *, .swatch-anim { animation: none !important; }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="940" height="370" rx="18" class="bg-canvas" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Header -->
  <text x="24" y="30" font-size="12" font-weight="700" letter-spacing="0.8" class="sans header-title">CENTRALIZED COLOR SYSTEM (SRC/THEME/COLORS.JS)</text>
  <text x="916" y="30" font-size="11" font-weight="500" text-anchor="end" class="sans header-sub">12 Canonical Foundation Tokens</text>

  <!-- Color Swatches Grid -->
  
    <g transform="translate(24, 48)" class="swatch-anim">
      <!-- Shadow & Card Base -->
