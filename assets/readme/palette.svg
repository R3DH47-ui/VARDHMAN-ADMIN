        <!-- Token Name -->
        <text x="0" y="14" font-size="13" font-weight="700" fill="#FFFFFF" class="sans">primary</text>
        
        <!-- Hex Code -->
        <rect x="0" y="24" width="76" height="20" rx="5" fill="rgba(255,255,255,0.18)" />
        <text x="38" y="38" font-size="11" font-weight="600" text-anchor="middle" fill="#FFFFFF" class="sans">#B0000F</text>
        
        <!-- Role -->
        <text x="0" y="58" font-size="10" font-weight="500" fill="rgba(255,255,255,0.75)" class="sans">Canonical Crimson</text>
      </g>
    </g>
    
