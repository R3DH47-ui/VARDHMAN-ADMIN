<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 115" width="100%" height="100%">
  <defs>
    <linearGradient id="langShimmer" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="50%" stop-color="white" stop-opacity="0.3" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
      <animate attributeName="x1" from="-100%" to="100%" dur="3s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="200%" dur="3s" repeatCount="indefinite" />
    </linearGradient>

    <clipPath id="barClip">
      <rect x="24" y="44" width="832" height="14" rx="7" ry="7" />
    </clipPath>
  </defs>

  <style>
    :root {
      --bg-bar: #0C0D0E;
      --card-bg: #141417;
      --border: rgba(255, 255, 255, 0.08);
      --text-pri: #FFFFFF;
      --text-sec: #909096;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg-bar: #FAF8F5;
        --card-bg: #FFFFFF;
        --border: #E8E3DE;
        --text-pri: #1A1A1A;
        --text-sec: #5F5E5E;
      }
      .bg-rect { fill: #FAF8F5 !important; stroke: #E8E3DE !important; }
      .text-title { fill: #1A1A1A !important; }
      .text-sub { fill: #5F5E5E !important; }
      .legend-text { fill: #1A1A1A !important; }
      .legend-sub { fill: #6B6B6B !important; }
    }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .bg-rect { fill: #0C0D0E; }
    .text-title { fill: #FFFFFF; }
    .text-sub { fill: #909096; }
    .legend-text { fill: #EEEEEE; }
    .legend-sub { fill: #888890; }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <!-- Background -->
  <rect width="880" height="115" rx="16" class="bg-rect" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" />

  <!-- Title & Total LOC -->
  <text x="24" y="28" font-size="12" font-weight="700" letter-spacing="0.8" class="sans text-title">CODEBASE COMPOSITION</text>
  <text x="856" y="28" font-size="11" font-weight="500" text-anchor="end" class="sans text-sub">8,325 Total Code &amp; Config Lines</text>

  <!-- Progress Bar Container -->
  <g clip-path="url(#barClip)">
    <!-- JavaScript Segment -->
    <rect x="24" y="44" width="796.2" height="14" fill="#F7DF1E" />
    
    <!-- Markdown Segment -->
    <rect x="820.2" y="44" width="22.5" height="14" fill="#4584B6" />
    
    <!-- JSON Segment -->
    <rect x="842.7" y="44" width="13.3" height="14" fill="#B0000F" />

    <!-- Shimmer sweep -->
    <rect x="24" y="44" width="832" height="14" fill="url(#langShimmer)" />
  </g>

  <!-- Legend -->
  <g transform="translate(24, 88)">
    <!-- Item 1: JavaScript -->
    <circle cx="6" cy="6" r="5" fill="#F7DF1E" />
    <text x="18" y="10" font-size="12" font-weight="600" class="sans legend-text">JavaScript</text>
    <text x="88" y="10" font-size="11" font-weight="400" class="sans legend-sub">95.7% (7,969 LOC • 76 files)</text>

    <!-- Item 2: Markdown -->
    <circle cx="340" cy="6" r="5" fill="#4584B6" />
    <text x="352" y="10" font-size="12" font-weight="600" class="sans legend-text">Markdown</text>
    <text x="418" y="10" font-size="11" font-weight="400" class="sans legend-sub">2.7% (223 LOC)</text>

    <!-- Item 3: JSON -->
    <circle cx="560" cy="6" r="5" fill="#B0000F" />
    <text x="572" y="10" font-size="12" font-weight="600" class="sans legend-text">JSON</text>
    <text x="612" y="10" font-size="11" font-weight="400" class="sans legend-sub">1.6% (133 LOC)</text>
  </g>
</svg>